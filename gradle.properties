kotlin.code.style=official

# Используется корневым settings.gradle.kts (pluginManagement).
# Синхронизирован с kotlinVersion в gradle/libs.versions.toml — менять в обоих местах.
kotlinVersion=2.4.20

# Компиляция Kotlin in-process: composite builds плодят несколько Kotlin-демонов,
# на параллельной компиляции main+test они OOM-ятся (GC overhead limit)
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx3g
