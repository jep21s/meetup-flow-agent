# Единый конфиг telegram-proxy. Формат: key=${ENV_VAR:default}
# Читается через ConfigLoader (libs/config-starter).

# Порт Ktor (Railway подставляет PORT сам)
server.port=${PORT:8082}

# --- Telegram-бот --------------------------------------------------------------
# ВЫКЛЮЧАТЕЛЬ БОТА: дефолт false — в тестах и при локальном запуске бот НЕ
# запускается (нет long polling и вызовов Bot API, отправка через заглушку).
# На Railway задать TELEGRAM_BOT_ENABLED=true.
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# Общий канал/группа анонсов (EVENT_PUBLISHED); fallback при пустых userIds.
# Пусто = не задан. Бот должен быть участником чата.
telegram.main.chat-id=${TELEGRAM_MAIN_CHAT_ID:}

# --- Авторизация входящих /api/notify (вызывает meetup-flow-agent) -------------
# Ожидается заголовок Authorization: Bearer {PROXY_TOKEN} — тот же секрет,
# что в proxy.token у main.
proxy.token=${PROXY_TOKEN:change-me-proxy-token}

# --- meetup-flow-agent (адрес основного сервиса) -------------------------------
meetup-flow.url=${MEETUP_FLOW_URL:http://localhost:8090}
# ВАЖНО: тот же секрет, что APP_TOKEN у main (/api/messages ждёт RAW Authorization)
meetup-flow.token=${MEETUP_FLOW_TOKEN:change-me-app-token}

# --- HITL ----------------------------------------------------------------------
# TTL заданных вопросов в pending-сторе (снятие неактуальных кнопок)
hitl.pending.ttl-hours=${HITL_PENDING_TTL_HOURS:24}
