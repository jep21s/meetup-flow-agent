# Dev-окружение meetup-flow-agent (§17 COMMON_PLAN.md).
# Приложение всегда запускается ВНЕ compose: ./gradlew :application:main:run
# (предварительно `docker compose up -d postgres`).
# jaeger/prometheus/grafana добавятся на этапе project.
#
# Переменные ${DB_*} интерполируются из .env в корне (docker compose читает его
# автоматически); постгрес-образу нужны canonical POSTGRES_* имена.

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-meetup_flow_agent}
      POSTGRES_USER: ${DB_USER:-meetup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meetup} -d ${DB_NAME:-meetup_flow_agent}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
