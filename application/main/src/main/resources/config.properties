# Единый конфиг application/main. Формат: key=${ENV_VAR:default}
# Читается через ConfigLoader (libs/config-starter).

# Токен REST API (заголовок Authorization на /api/*)
app.token=${APP_TOKEN:change-me-token}

# CORS: пусто = выключен, * = anyHost, либо comma-list полных origin (http(s)://host[:port])
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# --- LLM: Z.AI (OpenAI-compatible) ---
# glm-5.3-flash — агентский цикл/извлечение; glm-5.3 (guardrails) подключается на этапе hw6
# Coding Plan (подписка): .../api/coding/paas/v4; Developer API (баланс): .../api/paas/v4
llm.baseUrl=${LLM_BASE_URL:https://api.z.ai/api/coding/paas/v4}
llm.apiKey=${LLM_API_KEY:}
llm.agent.model=${LLM_AGENT_MODEL:glm-5.3-flash}
# guardrails — сильная модель (роутинг «безопасность → продвинутая»)
llm.guardrails.model=${LLM_GUARDRAILS_MODEL:glm-5.3}

# --- Лимит циклов ReAct (§8.4): 8 → +4 при прогрессе → 16 ---
react.baseLimit=8
react.extendBy=4
react.maxLimit=16

# --- Инструменты агента ---
# Политика вызова тула: allow | ask | block (v1 — все allow; ask активируется на этапе project)
tool.fetch_web_page.policy=${TOOL_FETCH_WEB_PAGE_POLICY:allow}
tool.search_duplicate.policy=${TOOL_SEARCH_DUPLICATE_POLICY:allow}

# --- БД: Postgres 18 + pgvector (docker-compose.yaml в корне) ---
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:meetup_flow_agent}
db.user=${DB_USER:meetup}
db.password=${DB_PASSWORD:}

# --- Эмбеддинги: Yandex AI Studio (OpenAI-compatible, §10) ---
embedding.baseUrl=${EMBEDDING_BASE_URL:https://ai.api.cloud.yandex.net/v1}
embedding.apiKey=${EMBEDDING_API_KEY:}
embedding.folderId=${EMBEDDING_FOLDER_ID:}
# Пусто → собирается из folderId: emb://<folderId>/text-embeddings-v2-doc/latest
embedding.modelUri=${EMBEDDING_MODEL_URI:}
# ОБЯЗАТЕЛЕН: дефолт модели Яндекса — 256 (проверено реальным запросом)
embedding.dimensions=${EMBEDDING_DIMENSIONS:768}

# --- Пороги дублей (§8.5) ---
dedup.thresholdHigh=0.92
dedup.thresholdLow=0.85
dedup.dateWindowDays=3

# --- Telegram-прокси (§11): исходящие уведомления и доставки публикаций ---
# Пустой baseUrl → уведомления noop, доставки outbox считаются выполненными
proxy.baseUrl=${PROXY_BASE_URL:}
proxy.token=${PROXY_TOKEN:}

# --- Telegram-слой (модуль application/telegram) -------------------------------
# Общий канал/группа: анонсы (EVENT_PUBLISHED) и fallback системных событий
# при пустых userIds; HITL-вопросы сюда не падают — только личные чаты users
telegram.main.chat-id=${TELEGRAM_MAIN_CHAT_ID:}
# Источники сырого passthrough: chatId[:topicId] через запятую (без topicId —
# вся группа); складывается с парой telegram.source.* ниже. Флоу создают
# только сообщения из этих чатов
telegram.sources=${TELEGRAM_SOURCES:}
# Источник сырого passthrough: флоу извлечения создают ТОЛЬКО сообщения из
# этой группы и этого топика (message_thread_id; форум-группа, General = 1).
# Любое значение пусто → по нему ограничений нет; оба пустые → фильтр выключен.
telegram.source.chat-id=${TELEGRAM_SOURCE_CHAT_ID:}
telegram.source.topic-id=${TELEGRAM_SOURCE_TOPIC_ID:}

# --- Шедулеры (§12): kill-switch через scheduler.<name>.enabled (ENV) ---
scheduler.inbox.enabled=${SCHEDULER_INBOX_ENABLED:true}
scheduler.inbox.intervalSeconds=${SCHEDULER_INBOX_INTERVAL_SECONDS:5}
scheduler.inbox.batchSize=${SCHEDULER_INBOX_BATCH_SIZE:10}
scheduler.inbox.parallelism=${SCHEDULER_INBOX_PARALLELISM:4}
scheduler.retry.enabled=${SCHEDULER_RETRY_ENABLED:true}
scheduler.retry.intervalSeconds=${SCHEDULER_RETRY_INTERVAL_SECONDS:15}
scheduler.humanTimeout.enabled=${SCHEDULER_HUMAN_TIMEOUT_ENABLED:true}
scheduler.humanTimeout.intervalSeconds=${SCHEDULER_HUMAN_TIMEOUT_INTERVAL_SECONDS:3600}
scheduler.outbox.enabled=${SCHEDULER_OUTBOX_ENABLED:true}
scheduler.outbox.intervalSeconds=${SCHEDULER_OUTBOX_INTERVAL_SECONDS:5}
scheduler.outbox.batchSize=${SCHEDULER_OUTBOX_BATCH_SIZE:10}
scheduler.outbox.parallelism=${SCHEDULER_OUTBOX_PARALLELISM:4}

# --- Ретраи флоу (RetryPoller) ---
retry.schedule=${RETRY_SCHEDULE:1m,5m,15m,1h,6h}
retry.maxAttempts=${RETRY_MAX_ATTEMPTS:6}

# --- HITL-таймауты (HumanTimeoutPoller) ---
human.reminderHours=${HUMAN_REMINDER_HOURS:24}
human.timeoutHours=${HUMAN_TIMEOUT_HOURS:48}

# --- Outbox-доставка публикаций: шкала как у флоу-ретраев ---
outbox.schedule=${OUTBOX_SCHEDULE:1m,5m,15m,1h,6h}
outbox.maxAttempts=${OUTBOX_MAX_ATTEMPTS:6}
# SENDING старше этого (краш между клеймом и отметкой) → сброс в PENDING
outbox.stuckSendingMinutes=${OUTBOX_STUCK_SENDING_MINUTES:5}

# --- Google Calendar (модуль application/google-calendar) -----------------------
# Доставка одобренных анонсов в календарь через сервисный аккаунт. Включение
# канала — строкой google_main в справочнике destinations (сеется миграцией
# ВЫКЛЮЧЕННОЙ): UPDATE destinations SET is_active=true,
#   config='{"calendarId":"<id вида xxx@group.calendar.google.com>"}'::jsonb
#   WHERE name='google_main'. Секрет — JSON-ключ сервисного аккаунта ЦЕЛИКОМ
# (одной строкой, из Cloud Console); calendarId — не-секрет в destinations.config.
google.calendar.credentials-json=${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
google.calendar.timezone=${GOOGLE_CALENDAR_TIMEZONE:Europe/Moscow}
# Дефолтная длительность события, когда в анонсе нет времени окончания
google.calendar.default-duration-minutes=${GOOGLE_CALENDAR_DEFAULT_DURATION_MINUTES:180}
# Точки входа API — переопределяются -D в тестах (WireMock подменяет Google)
google.oauth.token-url=${GOOGLE_OAUTH_TOKEN_URL:https://oauth2.googleapis.com/token}
google.calendar.api-base=${GOOGLE_CALENDAR_API_BASE:https://www.googleapis.com/calendar/v3}
