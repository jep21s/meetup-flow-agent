# Единый конфиг application/main. Формат: key=${ENV_VAR:default}
# Читается через ConfigLoader (libs/config-starter).

# Токен REST API (заголовок Authorization на /api/*)
app.token=${APP_TOKEN:change-me-token}

# CORS: пусто = выключен, * = anyHost, либо comma-list полных origin (http(s)://host[:port])
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:}

# --- LLM: Z.AI (OpenAI-compatible) ---
# glm-5.3-flash — агентский цикл/извлечение; glm-5.3 (guardrails) подключается на этапе hw6
# Coding Plan (подписка): .../api/coding/paas/v4; Developer API (баланс): .../api/paas/v4
llm.baseUrl=${LLM_BASE_URL:https://api.z.ai/api/coding/paas/v4}
llm.apiKey=${LLM_API_KEY:}
llm.agent.model=${LLM_AGENT_MODEL:glm-5.3-flash}

# --- Инструменты агента ---
# Политика вызова тула: allow | ask | block (v1 — все allow; ask активируется на этапе project)
tool.fetch_web_page.policy=${TOOL_FETCH_WEB_PAGE_POLICY:allow}
